name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin and the marketplace
        run: |
          claude plugin validate ./mod
          claude plugin validate .
      - name: Tests
        run: claude plugin test ./mod
      - name: Generated art is up to date
        run: |
          python3 tools/draw_art.py
          git diff --exit-code mod/hooks/characters/art.ts
